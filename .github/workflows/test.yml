name: test

on:
  push:
  pull_request:

jobs:
  covo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install COVO
        run: |
          python -m pip install --upgrade pip
          pip install -e covo
      - name: Test COVO
        run: PYTHONPATH=covo/src python -m unittest discover -s covo/tests
      - name: Compile Python files
        run: python -m compileall covo/src covo/scripts covo/tests
