# pytorch_lightning==1.9.5
seed_everything: 123
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 32-true
  logger:
    class_path: pytorch_lightning.loggers.MLFlowLogger
    init_args:
      run_name: aishell_sensevoice_kws
      experiment_name: keyword-spotting
      tracking_uri: file:./outputs/mlruns
      log_model: true
  callbacks: null
  fast_dev_run: false
  max_epochs: 30
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 50
  enable_checkpointing: true
  enable_progress_bar: null
  enable_model_summary: null
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: true
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./outputs/aishell_sensevoice_kws
f1_checkpoint:
  dirpath: ./outputs/aishell_sensevoice_kws/checkpoints/f1
  filename: f1-{epoch}-{step}
  monitor: metrics/f1
  verbose: false
  save_last: false
  save_top_k: 1
  save_weights_only: false
  mode: max
  auto_insert_metric_name: true
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: 1
  save_on_train_epoch_end: null
f1_generalization_checkpoint:
  dirpath: ./outputs/aishell_sensevoice_kws/checkpoints/f1G
  filename: f1G-{epoch}-{step}
  monitor: metrics/f1_zh
  verbose: false
  save_last: false
  save_top_k: 1
  save_weights_only: false
  mode: max
  auto_insert_metric_name: true
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: 1
  save_on_train_epoch_end: null
checkpoint_final:
  dirpath: ./outputs/aishell_sensevoice_kws/checkpoints/final
  filename: final-{epoch}-{step}
  monitor: null
  verbose: true
  save_last: false
  save_top_k: 1
  save_weights_only: false
  mode: min
  auto_insert_metric_name: true
  every_n_train_steps: null
  train_time_interval: null
  every_n_epochs: 1
  save_on_train_epoch_end: true
early_stopping:
  monitor: metrics/f1_zh
  min_delta: 0.0
  patience: 5
  verbose: false
  mode: max
  strict: true
  check_finite: true
  stopping_threshold: null
  divergence_threshold: null
  check_on_train_epoch_end: null
  log_rank_zero_only: false
data:
  class_path: data.data_module.KWSDataMod
  init_args:
    train_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell_sensevoice
        kw_type: all
    val_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell_sensevoice
        kw_type: tts
      - name: aishell
        root: ../datasets/aishell/data_aishell_sensevoice
        kw_type: natural
    test_info:
      name: aishell
      root: ../datasets/aishell/data_aishell_sensevoice
      kw_type: tts
    test_split: test
    features_size:
      - 150
      - 750
    num_workers: 8
    hotwords_per_group: 100
    # Only used by the generic test dataloader for audio features. KWS training
    # itself reads precomputed SenseVoice hidden states from disk.
    whisper_ckpt: openai/whisper-large-v3
ckpt_path: null
model:
  class_path: model.model.KWSModel
  init_args:
    backbone: tcresnet
    tcresnet_channels: 96
    tcresnet_blocks: 8
    tcresnet_dropout: 0.15
    subsequence_aux: true
    subsequence_aux_weight: 0.02
    subsequence_aux_temperature: 0.5
    decision_threshold_mode: max_precision_at_min_recall
    decision_threshold_fixed: 0.5
    decision_threshold_fbeta: 0.7
    decision_threshold_min_recall: 0.82
    decision_threshold_min_precision: 0.0
    decision_threshold_grid_size: 501
    large_heads: true
    adversarial_training: false
    dannce: false
    adversarial_examples_ratio: 0.5
    adversarial_examples_lr: 1.0e-6
    adversarial_train_steps: 5
    adv_kl_weight: 1.0
    entropy: false
    domain_adversary_weight: 0.1
    entropy_weight: 0.1
    supression_decay: 0.1
    early_adversary_supression: true
    num_domains: 2
    sampling: random
    resample_every_epoch: true
    kw_type: all
    kw_p: 0.5
    batch_size: 20
    accumulate_grad_batches: 4
    learning_rate: 2.0e-05
    features_lr: 2.0e-05
    classifier_lr: 2.0e-05
    discriminator_lr: 2.0e-05
    lr_step: 12
    weight_decay: 1.0e-04
    beta_1: 0.9
    beta_2: 0.98
