# pytorch_lightning==2.0.2
seed_everything: 123
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 32-true
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./outputs/kws_aishell_current_eval
data:
  class_path: data.data_module.KWSDataMod
  init_args:
    train_info: 
      - name: aishell
        root: ../datasets/aishell/data_aishell
        kw_type: natural
    val_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell
        kw_type: natural
    test_info:
      name: aishell
      root: ../datasets/aishell/data_aishell
      kw_type: tts
    test_split: test
    features_size: 
      - 150
      - 750
    batch_size: 1
    sampling: random
    num_workers: 8
    hotwords_per_group: 100
    whisper_ckpt: openai/whisper-large-v2
ckpt_path: /root/autodl-tmp/src/mlruns/641753688314575260/d9b9fafe87d64bc98400705d2c58525c/checkpoints/f1G-epoch=7-step=48040.ckpt
verbose: true
model:
  class_path: model.model.KWSModel
  init_args:
    backbone: tcresnet
    tcresnet_channels: 96
    tcresnet_blocks: 8
    tcresnet_dropout: 0.15
    subsequence_aux: true
    subsequence_aux_weight: 0.02
    subsequence_aux_temperature: 0.5
    decision_threshold_mode: max_precision_at_min_recall
    decision_threshold_fixed: 0.5
    decision_threshold_fbeta: 0.7
    decision_threshold_min_recall: 0.82
    decision_threshold_min_precision: 0.0
    decision_threshold_grid_size: 501
    large_heads: true
    adversarial_training: false
    dannce: false
    adversarial_examples_ratio: 0.5
    adversarial_examples_lr: 1.0e-6
    adversarial_train_steps: 5
    adv_kl_weight: 1.0
    entropy: false
    domain_adversary_weight: 0.1
    entropy_weight: 0.1
    supression_decay: 0.1
    early_adversary_supression: true
    num_domains: 2
    sampling: random
    resample_every_epoch: true
    kw_type: all
    kw_p: 0.5
    batch_size: 20
    accumulate_grad_batches: 4
    learning_rate: 2.0e-05
    features_lr: 2.0e-05
    classifier_lr: 2.0e-05
    discriminator_lr: 2.0e-05
    lr_step: 12
    weight_decay: 1.0e-04
    beta_1: 0.9
    beta_2: 0.98
