# CB-SenseVoice domain-transfer evaluation on MAGICDATA-READ with an oracle
# split-specific contextual vocabulary extracted from each split's references.
seed_everything: 123
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 32-true
  logger: null
  callbacks: null
  max_steps: -1
  limit_test_batches: null
  inference_mode: true
  deterministic: true
  default_root_dir: ./outputs/cb_sensevoice_magicdata

f1_checkpoint:
  dirpath: ./outputs/cb_sensevoice_magicdata/checkpoints/f1
  monitor: metrics/f1
f1_generalization_checkpoint:
  dirpath: ./outputs/cb_sensevoice_magicdata/checkpoints/f1G
  monitor: metrics/f1_zh
checkpoint_final:
  dirpath: ./outputs/cb_sensevoice_magicdata/checkpoints/final
  monitor: null
early_stopping:
  monitor: metrics/f1_zh

data:
  class_path: data.data_module.KWSDataMod
  init_args:
    train_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell_sensevoice
        kw_type: tts
    val_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell_sensevoice
        kw_type: tts
    test_info:
      name: magicdata
      root: ../datasets/magicdata_read/cb_sensevoice_oraclelex600
      kw_type: tts
    test_split: dev
    features_size: [150, 750]
    batch_size: 1
    sampling: random
    num_workers: 0
    hotwords_per_group: 100
    asr_backend: sensevoice
    whisper_ckpt: ""

ckpt_path: null
verbose: true

model:
  class_path: model.cb_sensevoice.CBSenseVoice
  init_args:
    dataset: magicdata
    split: dev
    root: ../datasets/magicdata_read/cb_sensevoice_oraclelex600/hotword
    kw_type: tts
    encoder_ckpt: ""
    whisper_ckpt: ""
    kws_ckpt: ./outputs/aishell_sensevoice_kws/checkpoints/f1G/f1G-epoch=16-step=102085.ckpt
    language: chinese
    asr_backend: sensevoice
    sensevoice_ckpt: iic/SenseVoiceSmall
    sensevoice_language: zh
    sensevoice_use_itn: false
    sensevoice_beam_size: 24
    sensevoice_token_topk: 32
    sensevoice_hotword_token_weight: 1.2
    sensevoice_hotword_completion_weight: 0.8
    sensevoice_context_adapter_path: ./outputs/sensevoice_context_adapter/phrase_crossattn_aishell_full_20260722.pt
    sensevoice_use_adapter_phrase_confidence: true
    sensevoice_adapter_phrase_confidence_weight: 14.0
    use_precomputed_kws_features: true
    prompt: true
    oracle: kws
    kws_features_size: [150, 750]
    keywords_per_group: 100
    kws_positive_threshold: 0.787
    kws_topk_per_group: 6
    kws_max_prompt_keywords: 28
    kws_infer_chunk_size: 64
    prompt_max_injected_keywords: 4
    prompt_score_threshold: 0.55
    prompt_relative_threshold: 0.80
    enable_nested_keyword_promotion: true
    nested_keyword_promotion_score_ratio: 0.95
    nested_keyword_promotion_min_long_chars: 3
    nested_keyword_promotion_max_extra: 2
    enable_phonetic_rescore: true
    rescore_nbest: 8
    rescore_generation_cap: 16
    rescore_use_asr_score: true
    rescore_asr_weight: 1.0
    rescore_keyword_weight: 1.8
    rescore_phonetic_weight: 0.7
    rescore_prefix_penalty_weight: 1.0
    rescore_max_keywords: 12
    enable_consensus_rerank: true
    consensus_rerank_weight: 0.35
    consensus_rerank_min_support: 2
    enable_insertion_penalty: true
    insertion_penalty_weight: 0.25
    insertion_penalty_free_chars: 1
    oracle_nbest_diagnostic: true
    oracle_nbest_detail_path: logs/oracle_nbest_detail_cb_sensevoice_magicdata_dev.csv
    oracle_nbest_summary_path: logs/oracle_nbest_summary_cb_sensevoice_magicdata_dev.csv
