# pytorch_lightning==2.0.2
seed_everything: 123
trainer:
  accelerator: gpu
  strategy: auto
  devices: 1
  num_nodes: 1
  precision: 32-true
  logger: null
  callbacks: null
  fast_dev_run: false
  max_epochs: null
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: null
  log_every_n_steps: null
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: ./outputs/cb_whisper_aishell_rerank_calibrated

data:
  class_path: data.data_module.KWSDataMod
  init_args:
    train_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell
        kw_type: tts
    val_info:
      - name: aishell
        root: ../datasets/aishell/data_aishell
        kw_type: tts
    test_info:
      name: aishell
      root: ../datasets/aishell/data_aishell
      kw_type: tts
    test_split: test
    features_size:
      - 150
      - 750
    batch_size: 1
    sampling: random
    num_workers: 8
    hotwords_per_group: 100
    whisper_ckpt: openai/whisper-large-v2

ckpt_path: null
verbose: true

model:
  class_path: model.cb_whisper.CBWhisper
  init_args:
    dataset: aishell
    split: test
    root: ../datasets/aishell/data_aishell/hotword
    kw_type: tts
    encoder_ckpt: openai/whisper-medium
    whisper_ckpt: openai/whisper-large-v2
    kws_ckpt: /root/autodl-tmp/src/mlruns/641753688314575260/d9b9fafe87d64bc98400705d2c58525c/checkpoints/f1G-epoch=7-step=48040.ckpt
    language: chinese

    prompt: true
    oracle: kws
    kws_features_size:
      - 150
      - 750
    keyword_prompt_prepend: "("
    keyword_prompt_append: ")"
    keyword_separator: " "
    keywords_per_group: 100

    # Keep KWS recall broad enough for rerank to choose, then let prompt pruning stay conservative.
    kws_positive_threshold: 0.30
    kws_topk_per_group: 6
    kws_max_prompt_keywords: 28
    kws_infer_chunk_size: 16
    prompt_max_injected_keywords: 4
    prompt_score_threshold: 0.55
    prompt_relative_threshold: 0.80
    enable_nested_keyword_promotion: true
    nested_keyword_promotion_score_ratio: 0.95
    nested_keyword_promotion_min_long_chars: 3
    nested_keyword_promotion_max_extra: 2
    keyword_perturb_prob: 0.0

    # Calibrated n-best rerank: scores are scaled inside each candidate pool in current code.
    enable_phonetic_rescore: true
    rescore_nbest: 8
    enable_confidence_gated_candidate_budget: true
    rescore_high_confidence_max_candidates: 24
    rescore_candidate_budget_min_top_score: 0.90
    rescore_candidate_budget_min_score_gap: 0.03
    rescore_use_asr_score: true
    rescore_asr_weight: 1.0
    rescore_keyword_weight: 1.8
    rescore_phonetic_weight: 0.7
    rescore_prefix_penalty_weight: 1.0
    shortform_no_repeat_ngram_size: 3
    rescore_max_keywords: 12
    enable_phonetic_surface_repair: true
    surface_repair_score_threshold: 0.95
    surface_repair_ambiguity_gap: 0.05
    surface_repair_max_keywords: 8
    surface_repair_max_edits: 2
    surface_repair_min_keyword_chars: 2
    surface_repair_max_keyword_chars: 6
    enable_phonetic_consensus_repair: true
    consensus_repair_score_threshold: 0.90
    consensus_repair_min_support: 2
    enable_consensus_rerank: true
    consensus_rerank_weight: 0.35
    consensus_rerank_min_support: 2

    oracle_nbest_diagnostic: true
    oracle_nbest_detail_path: logs/oracle_nbest_detail_aishell.csv
    oracle_nbest_summary_path: logs/oracle_nbest_summary_aishell.csv
